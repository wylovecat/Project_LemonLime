name: CPack - DEB - Debian

on:
  # push代码时触发workflow
  push:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # pull_request时触发workflow
  pull_request:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  release:
    types: [published]

# The release step uploads the .deb to the tag via GITHUB_TOKEN; the
# repository default is a read-only token, so ask for write access explicitly.
permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        #distro: [stable, testing, sid]
        build_type: [Release, RelWithDebInfo]
        distro: [testing, sid]
    name: Debian ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.distro }}

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
      - name: Get the version
        id: get_version
        shell: bash
        run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT
      - name: Checking out sources
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Install build dependencies
        run: |
          # qt6-httpserver-dev/qt6-websockets-dev: the embedded online
          # submission service (ENABLE_ONLINE_SERVER defaults to ON and hard-
          # errors at configure time without Qt6::HttpServer).
          apt-get install -y build-essential ninja-build qt6-base-dev qt6-tools-dev qt6-svg-dev qt6-image-formats-plugins qt6-translations-l10n qt6-httpserver-dev qt6-websockets-dev cmake pkgconf bash
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -GNinja -DEMBED_TRANSLATIONS=OFF -DEMBED_DOCS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_DEB=ON -DLEMON_BUILD_INFO="Build for Debian" -DLEMON_BUILD_EXTRA_INFO="Build on $(uname -sr)"
          cmake --build . --target package --parallel $(nproc)
      - name: Get package name
        shell: bash
        id: get_package
        run: |
          echo "NAME=$(basename build/LemonLime-*.deb)" >> $GITHUB_OUTPUT
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LemonLime-${{ steps.get_version.outputs.VERSION }}-debian-${{ matrix.distro }}-${{ matrix.build_type }}.deb
          path: build/${{ steps.get_package.outputs.NAME }}
      - name: Upload binaries to release
        # Only the Release .deb is published; the RelWithDebInfo leg stays a CI
        # artifact. Both distros still upload, so a release carries one .deb for
        # debian-testing and one for debian-sid.
        if: matrix.build_type == 'Release' && startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/${{ steps.get_package.outputs.NAME }}
          asset_name: LemonLime-${{ steps.get_version.outputs.VERSION }}-debian-${{ matrix.distro }}-${{ matrix.build_type }}.deb
          tag: ${{ github.ref }}
          overwrite: true
