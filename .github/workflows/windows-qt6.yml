name: Windows Qt6
on:
  # push代码时触发workflow
  push:
    # 忽略README.md
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # pull_request时触发workflow
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # 发布 release 时，Release 变体额外产出并上传便携包
  release:
    types: [published]
  # 手动补跑打包：把便携包重新传到指定 tag（不改动源码）
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the portable package to (for example 0.3.7.1)
        required: true
        type: string

# The release job uploads the packaged zip to the tag via GITHUB_TOKEN; the
# repository default is a read-only token, so ask for write access explicitly.
permissions:
  contents: write

jobs:
  build:
    name: Build
    strategy:
      matrix:
        qt_version: [6.12.0]
        build_type: [Release, RelWithDebInfo, Debug]
        platform: [windows-latest]
        include:
          - platform: windows-latest
            arch: x64
            qtarch: win64_msvc2022_64
      fail-fast: false

    runs-on: ${{ matrix.platform }}
    env:
      targetName: lemon.exe
    # 步骤
    steps:
      - name: Checking out sources
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev" >> "$GITHUB_ENV"
          fi
      - name: Install Python 3.12 version
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Restoring submodules
        run: git submodule update --init
      # =========================================================================================================
      - name: Install MSVC compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64
      - name: Installing Qt - x64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qtarch }}
          cache: true
          setup-python: "false"
          # qtactiveqt: AxContainer for ENABLE_XLS_EXPORT.
          # qthttpserver/qtwebsockets: the embedded online submission service
          # (ENABLE_ONLINE_SERVER=ON by default, which is a hard configure error
          # when Qt6::HttpServer is missing) and its server-smoke test.
          modules: "qtactiveqt qthttpserver qtwebsockets"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Win-x64 - ${{ matrix.qt_version }} - Generate Dependencies and Build
        shell: bash
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          cmake . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLEMON_BUILD_INFO="Build for Windows" \
            -DLEMON_BUILD_EXTRA_INFO="Build on Windows x64" \
            -DENABLE_XLS_EXPORT=ON
          cmake --build . --parallel $(nproc)
      - name: Deploy Qt for tests
        shell: pwsh
        run: |
          windeployqt tests\test1\test1.exe
          windeployqt tests\server-smoke\server-smoke.exe
      - name: Run tests
        shell: bash
        env:
          QT_LOGGING_RULES: "*.debug=true"        # 强制开启所有 debug 级别日志
          QT_ASSUME_STDERR_HAS_CONSOLE: 1         # 欺骗 Qt，让它以为存在真实的控制台
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          ctest --test-dir . -V --timeout 120
      # The portable bundle is a release product: build it for Release only, so the
      # other legs stay plain build+test runs. cmake/platforms/windows.cmake owns the
      # layout (lemon.exe + Qt runtime + MSVC runtime + `portable` marker).
      - name: Package portable bundle
        if: matrix.build_type == 'Release'
        shell: bash
        run: cmake --build . --target windows-portable --parallel $(nproc)
      - name: Prepare release assets
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          # Rename to the published asset convention. The version is read back from the
          # artifact the packaging target produced, so this step does not depend on the
          # tag being resolvable (it also runs on ordinary pushes).
          src=$(ls portable/lemon-*-Windows-*-portable.zip)
          version=$(basename "$src" | sed -E 's/^lemon-(.*)-Windows-.*-portable\.zip$/\1/')
          asset="LemonLime-${version}-windows-qt6-${{ matrix.arch }}.zip"
          mkdir -p release-assets
          cp "$src" "release-assets/$asset"
          (cd release-assets && sha256sum "$asset" > "$asset.sha256")
          echo "release asset: $asset"
          cat "release-assets/$asset.sha256"
      - name: Upload artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: LemonLime-windows-qt6-x64-portable-${{ matrix.build_type }}
          path: release-assets/*
      - name: Upload portable package to release
        if: matrix.build_type == 'Release' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-assets/*
          file_glob: true
          tag: ${{ env.VERSION }}
          overwrite: true
