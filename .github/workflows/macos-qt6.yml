name: MacOS Qt6
on:
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  release:
    types: [published]
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        build_type: [Release, RelWithDebInfo, Debug]
        arch: [x86_64, arm64]
        qt_ver: [6.9.3]
        qt_arch: [clang_64]
    env:
      targetName: lemon
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          cache: true
          # Needed by the embedded online submission service, which is on by
          # default (ENABLE_ONLINE_SERVER=ON) and a hard configure error
          # otherwise. qthttpserver pulls in qtwebsockets.
          modules: "qthttpserver qtwebsockets"

      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: build macos
        run: |
          cmake . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLEMON_BUILD_INFO="Build for macOS" \
            -DLEMON_BUILD_EXTRA_INFO="Build on $(uname -sr)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" 
          cmake --build . --parallel $(sysctl -n hw.logicalcpu)
      - name: Run tests
        if: ${{ false }}
        run: |
          ctest --test-dir . --output-on-failure --timeout 120
      # The full suite stays disabled above because test1 is timing-sensitive on
      # macOS. The online submission service still needs coverage: server-smoke
      # is a guiless QHttpServer test that binds loopback, so it runs here
      # without depending on the display or on test1.
      - name: Run online server smoke test
        run: |
          ctest --test-dir . -R server-smoke --output-on-failure --timeout 120
      # tag 打包
      - name: package
        env:
          Qt6_DIR: ../Qt/${{matrix.qt_ver}}/${{matrix.qt_arch}}
        run: |
          # 拷贝依赖
          #mv ${targetName} ${targetName}.app
          export PATH=$Qt6_DIR/bin:$PATH
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.targetName }}-Qt${{ matrix.qt_ver }}-${{ matrix.build_type }}-${{ matrix.arch }}.dmg
          path: ${{ env.targetName }}.dmg
      - name: uploadRelease
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ env.targetName }}.dmg
          asset_name: ${{ env.targetName }}-Qt${{ matrix.qt_ver }}-${{ matrix.build_type }}-${{ matrix.arch }}.dmg
          tag: ${{ github.ref }}
